# =============================================================================
# Mantis Leaderboard — Scoring Rules (v3)
# -----------------------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for how points are awarded.
# Change point values here and the leaderboard recomputes on the next run.
#
# Design for how Mantis actually works: lots of people already code, often
# with AI, often as many small PRs. The board should rank a week of real
# work, not who merged the most times. A solid day of shipping ≈ a solid
# day of reviewing ≈ a small amount of issue triage. One burst-merge day
# cannot buy the week.
# =============================================================================

version: 3

# How far back to look. The leaderboard is recomputed from scratch each run,
# so this just bounds the API queries.
lookback_days: 365

# Exactly which repos this leaderboard tracks (owner/name). Add a line when
# a new Mantis repo exists; nothing else needs to change. This is also what
# the read-only token should be scoped to in GitHub settings — see README.md.
repos:
  - KellisLab/Mantis
  - KellisLab/MantisAPI
  - KellisLab/MantisIntegrations
  - KellisLab/Mantis-Public
  - KellisLab/Mantis_SDK
  - KellisLab/MantisExtensions
  - KellisLab/MantisExtensionsBackend
  - KellisLab/auto-meeting-minutes
  - KellisLab/Mantis-Discord-Bot
  - KellisLab/mantis_transcribe_minutes
  - KellisLab/mantis-docs
  - KellisLab/mantis_course
  - KellisLab/Mantis-verticals
  - KellisLab/generator-mantis
  - KellisLab/mantis-cli

# -----------------------------------------------------------------------------
# Pull Requests
# -----------------------------------------------------------------------------
# Unit of value = a DAY of shipping, not a PR. Two merged PRs is a full
# coding day. The 71st PR that day is the same day of work, not 71 days.
pull_requests:
  # bonus(lines) = max_bonus * lines / (lines + half_life_lines)
  # 1 line -> ~10.5, 50 -> ~15, 250 -> ~19, 1000+ -> ~22 (flat).
  points:
    base: 10            # every merged PR starts here, regardless of size
    max_bonus: 12        # the most size alone can ever add
    half_life_lines: 60  # lines at which you've earned half of max_bonus

  # Dashboard size breakdown only — not used in scoring.
  size_buckets:
    XS: 10
    S: 50
    M: 250
    L: 800
    # XL: everything above L

  multipliers:
    documentation: 1.25   # PR has a label in `documentation_labels` below
    first_pr: 1.5         # contributor's first merged PR in the lookback window
    high_impact: 1.5      # PR has a label in `impact_labels` below

  documentation_labels: ["documentation", "docs"]

  # Maintainer-applied. Dormant until those labels are used; size is then
  # the only quality proxy. Rename to match labels the repos actually have.
  impact_labels: ["priority: critical", "priority: high", "impact: high"]

  # Self-merged / unreviewed PRs are common here (AI dumps, merge-queue
  # bursts). They still count — shipping is shipping — but they pay half,
  # so a reviewed 50-line fix beats an unreviewed 50-line dump.
  # "Reviewed" = at least one non-author review that itself would score
  # (Approved, Changes requested, or a substantive Comment).
  unreviewed_multiplier: 0.5

  exclude_paths:
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/*.lock"
    - "dist/**"
    - "build/**"
    - "**/vendor/**"
    - "**/*.min.js"
    - "**/*.map"

  count_merges_to: ["main", "master"]

  # First 2 PRs/day at full value (a normal Mantis cadence). After that,
  # decay to zero — the daily cap is the real brake, not a 12% floor that
  # still pays for the 71st merge.
  daily_diminishing:
    after: 2
    decay: 0.4
    min_factor: 0

  # Hard ceiling on PR POINTS per person per UTC day. ~2 typical PRs
  # (10–22 each). 71 merges on Aug 8 and 2 solid PRs the same day both
  # land here. Spreading work across the week is the only way to stack.
  max_points_per_day: 36

# -----------------------------------------------------------------------------
# Reviews
# -----------------------------------------------------------------------------
# Mantis barely uses formal Approve (3 scored reviews in a live week).
# Real review here is comments. Count those, but never let reviewing
# outrun a day of shipping.
reviews:
  approved_points: 8
  changes_requested_points: 10   # finding problems is worth more than LGTM
  commented_points: 6            # Finish-review comment with a real body

  min_body_length: 20            # Approved / Changes requested
  commented_min_body_length: 40  # comments need more than "lgtm" / "nice"

  exclude_self_review: true

  # One credit per (reviewer, PR). The HIGHEST-value review type wins
  # (so comment-then-approve pays 8, not 6). Re-clicking does not stack.
  one_per_pr_per_reviewer: true

  # ~2–3 substantive reviews. A review day cannot beat a shipping day.
  max_points_per_day: 20

# -----------------------------------------------------------------------------
# Issues
# -----------------------------------------------------------------------------
# Cheap to open, including by script. Keep them as a side-channel.
issues:
  created_points: 2
  closed_bonus: 1

  daily_diminishing:
    after: 2
    decay: 0.4
    min_factor: 0.05

  # 7 days × 6 = 42, less than two coding days. Filing tickets all week
  # cannot look like shipping all week.
  max_points_per_day: 6

  # Dormant until the labels exist. A labeled issue REPLACES created_points.
  difficulty_points:
    "difficulty: 1": 1
    "difficulty: 2": 2
    "difficulty: 3": 4
    "difficulty: 4": 7
    "difficulty: 5": 11
    "difficulty: 6": 16

  duplicate_labels: ["duplicate", "wontfix", "invalid"]

# -----------------------------------------------------------------------------
# Manual / off-platform contributions
# -----------------------------------------------------------------------------
# Discord, talks, docs hosted elsewhere. Count ONLY when approved in
# data/manual.yml. Tune per-entry with `points` if needed.
manual_contributions:
  categories:
    discord_support: { points: 10, label: "Discord support",  emoji: "💬" }
    blog_post:       { points: 40, label: "Blog post",         emoji: "✍️" }
    demo:            { points: 30, label: "Demo / showcase",   emoji: "🎬" }
    documentation:   { points: 25, label: "Docs (off-repo)",   emoji: "📚" }
    mentorship:      { points: 35, label: "Mentorship",        emoji: "🧭" }
    event:           { points: 20, label: "Event / talk",      emoji: "🎤" }
    other:           { points: 10, label: "Other",             emoji: "⭐" }

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------
display:
  top_n_in_readme: 10
  # Humans only. MantisCartography is an agent without a [bot] suffix.
  exclude_logins:
    - "dependabot[bot]"
    - "github-actions[bot]"
    - "renovate[bot]"
    - "MantisCartography"
  exclude_login_patterns:
    - "\\[bot\\]$"
  # Ranked by the first window. 7 days = who's active now; 14 = the same
  # idea, slower. Consistency across days beats a single dump in both.
  windows_days: [7, 14]
