# =============================================================================
# Mantis Leaderboard — Scoring Rules (v4)
# -----------------------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for how points are awarded.
# Change point values here and the leaderboard recomputes on the next run.
#
# Design: rank people who make Mantis better, not who generated the most
# GitHub events. Shipping, reviewing, and finding bugs are different jobs —
# they share one overall score, and they also have their own boards.
#
# Extra work the same day still counts. It just counts a bit less, so a
# 70-PR burst cannot look like a month of work, and a 7-PR day is still
# worth more than a 2-PR day.
# =============================================================================

version: 4

# How far back to look. Incremental sync only fetches what changed since the
# last successful run; a daily full audit re-lists the whole window and
# checksums against Search issueCount (Search cannot return >1000 hits, but
# it still reports the true total).
lookback_days: 365

# Organization used for repo discovery. The explicit `repos:` list is always
# fetched; discovery ADDS matching repos the token can see.
org: KellisLab

# Exactly which repos this leaderboard tracks (owner/name). Add a line when
# a new Mantis repo exists; nothing else needs to change. This is also what
# the read-only token should be scoped to in GitHub settings — see README.md.
repos:
  - KellisLab/Mantis
  - KellisLab/MantisAPI
  - KellisLab/MantisIntegrations
  - KellisLab/Mantis-Public
  - KellisLab/Mantis_SDK
  - KellisLab/MantisExtensions
  - KellisLab/MantisExtensionsBackend
  - KellisLab/auto-meeting-minutes
  - KellisLab/Mantis-Discord-Bot
  - KellisLab/mantis_transcribe_minutes
  - KellisLab/mantis-docs
  - KellisLab/mantis_course
  - KellisLab/Mantis-verticals
  - KellisLab/generator-mantis
  - KellisLab/mantis-cli

repo_discovery:
  enabled: true
  include_archived: false
  include_forks: false
  include_patterns:
    - "^Mantis"
    - "^mantis"
    - "^auto-meeting-minutes$"
    - "^generator-mantis$"
  extra: []
  exclude: []

# Listing sync. Search is a checksum only — never the source of truth.
sync:
  overlap_minutes: 120
  checksum_search: true
  fail_on_checksum_miss: false

# -----------------------------------------------------------------------------
# Pull Requests
# -----------------------------------------------------------------------------
# A merged PR is a ship, not a day of work. Size is a small bonus, not the
# definition of value. High-impact / bug-fix labels are the quality signal.
pull_requests:
  # bonus(lines) = max_bonus * lines / (lines + half_life_lines)
  # Size can add at most 4 pts. A 50-line fix and a 1,500-line refactor
  # should not be an order of magnitude apart.
  points:
    base: 10            # every merged PR starts here
    max_bonus: 4        # the most size alone can ever add
    half_life_lines: 80 # lines at which you've earned half of max_bonus

  # Dashboard size breakdown only — not used as the main score.
  size_buckets:
    XS: 10
    S: 50
    M: 250
    L: 800
    # XL: everything above L

  multipliers:
    high_impact: 1.5      # PR has a label in `impact_labels` below

  documentation_labels: ["documentation", "docs"]

  # Docs PRs are classified separately (their own breakdown line), not
  # given a flat +25%. A one-line README fix and a real guide then differ
  # by size / impact labels like any other ship.

  # Maintainer-applied. Dormant until those labels are used.
  impact_labels: ["priority: critical", "priority: high", "impact: high"]

  # Bug-fix PRs: small additive bonus on top of the ship, and they also
  # show up on the bug board via the issue they close when labeled.
  bug_labels: ["bug", "bugfix", "fix"]
  bug_fix_bonus: 4

  exclude_paths:
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/*.lock"
    - "dist/**"
    - "build/**"
    - "**/vendor/**"
    - "**/*.min.js"
    - "**/*.map"

  count_merges_to: ["main", "master"]

  # Rolling 24-hour window, not UTC midnight. 1st and 2nd PR at full
  # value; later PRs still count, at a declining rate. No hard ceiling.
  daily_diminishing:
    window_hours: 24
    factors: [1.0, 1.0, 0.80, 0.65, 0.50, 0.35]

# -----------------------------------------------------------------------------
# Reviews
# -----------------------------------------------------------------------------
# Reward review *outcome* and a few cheap quality signals, not character
# count. A short comment that names a race condition should beat a long
# padded LGTM. Authors are not punished when nobody reviews their PR —
# the reviewer is rewarded instead.
reviews:
  approved_points: 6
  changes_requested_points: 8   # finding problems is worth more than LGTM
  commented_points: 4            # finish-review comment with a real body

  # Quality signals on top of the outcome (all optional, all additive):
  inline_comment_bonus: 3        # at least one substantive inline comment
  nontrivial_pr_bonus: 2         # reviewed a PR above `nontrivial_pr_lines`
  addressed_changes_bonus: 4     # CHANGES_REQUESTED and the PR later merged
  nontrivial_pr_lines: 40
  min_inline_length: 15

  min_body_length: 20            # Changes requested, unless inline comments
  commented_min_body_length: 40  # comments need more than "lgtm" / "nice"
  # A rubber-stamp approval is the easiest review to fake, so a bare APPROVED
  # needs a real body — "LGTM, looks good to me!" (22 chars) scores nothing.
  # An approval carrying a substantive inline comment always qualifies, however
  # short its body: that's a real review. Finding problems keeps the lower bar
  # above, because a nine-word CHANGES_REQUESTED can be entirely legitimate.
  approved_min_body_length: 60

  exclude_self_review: true

  # One credit per (reviewer, PR). The HIGHEST-value review type wins
  # (so comment-then-approve pays 6, not 4). Re-clicking does not stack.
  one_per_pr_per_reviewer: true

  daily_diminishing:
    window_hours: 24
    factors: [1.0, 1.0, 0.80, 0.65, 0.50, 0.35]

# -----------------------------------------------------------------------------
# Issues — SCORING DISABLED
# -----------------------------------------------------------------------------
# Issues award ZERO points. The board ranks on code shipped and code reviewed,
# nothing else.
#
# WHY: no pricing of issue *filing* survived contact with the data. Filing is
# unverified at the moment it happens, so any value you attach to it rewards
# typing rather than finding. Every variant we measured put someone with a
# handful of tickets above people with a hundred real contributions —
# a 0-5 point board where the ranking was essentially noise. Pricing the
# verified side instead (paying the reporter once a fix lands) was defensible,
# but it depends on `closes #N` linkage that sits at 27%, so it silently
# ignored ~300 genuine finds. Rather than ship a ranking nobody can defend,
# issues score nothing until the linkage problem is fixed.
#
# Issue COUNTS are still collected and still shown as activity ("3 issues
# opened") — they are true and useful. They just do not move the ranking.
#
# TO RE-ENABLE: the engine is fully intact and unit-tested; only these values
# were zeroed. Restore the numbers in the comments below and put the "bugs"
# entry back in BOARDS in src/render.mjs. Do the PR-template work first — it
# is the thing that makes any of this fair.
issues:
  created_points: 0        # was 1

  # Reporter's fee once a fix lands. Was 8, paid to the filer when either
  # somebody else closed the issue as completed, or a merged PR closed it
  # (including their own). `closed_bonus_to: reporter` is kept so the wiring
  # stays correct if this is switched back on.
  closed_bonus: 0          # was 8
  closed_bonus_to: reporter

  # Capped severity kicker, counted ONLY when somebody other than the filer
  # applied the label (44 of 55 diff:N labels are self-applied — see the audit
  # note under `difficulty_points`). Was high: 4 / medium: 2.
  severity_bonus:
    high: 0                # was 4
    medium: 0              # was 2
    high_labels: ["imp:7", "imp:8", "imp:9", "pri:7", "pri:8", "pri:9",
                  "diff:7", "diff:8", "diff:9", "diff:10", "super-issue"]
    medium_labels: ["imp:4", "imp:5", "imp:6", "pri:4", "pri:5", "pri:6",
                    "diff:4", "diff:5", "diff:6"]

  # IMPORTANT: each of the *_points below OVERRIDES `created_points` in
  # score.mjs when its label matches — they are not additive. So zeroing
  # `created_points` alone does NOT disable issue scoring; every tier has to
  # be zeroed too. `bug` in particular exists in all 15 repos, so leaving
  # bug_points at 6 would have kept most issues scoring.
  bug_labels: ["bug", "defect"]
  bug_points: 0            # was 6

  # Also VERIFIED DORMANT (audited 2026-08-16 against all 15 repos via the
  # API): none of these labels exist anywhere in the org, so these two never
  # awarded anything even before being zeroed. Closest real labels are
  # `priority: medium`, `priority-medium` and `importance: normal` — none of
  # which mean "critical". Deliberately not remapped: see the note on
  # `difficulty_points` for why the org's real severity labels aren't safe
  # to score.
  confirmed_labels: ["confirmed", "accepted"]
  confirmed_points: 0      # was 10
  impact_labels: ["priority: critical", "priority: high", "impact: high"]
  impact_points: 0         # was 16

  # Filing in bursts is how triage actually works — sitting down and writing
  # up twenty things you found is normal, not abuse. The old curve bottomed out
  # at 6%, which is what produced a "Bug finding" board whose entire range was
  # 0-5 points and ranked someone with 8 lifetime issues above someone with
  # 105. Volume still decays; it no longer collapses.
  # NOTE: the verified-fix bonus above is never decayed by this at all.
  daily_diminishing:
    window_hours: 24
    factors: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5]

  # Ceiling on points from FILING alone in any rolling 24h. The verified-fix
  # bonus is exempt (see score.mjs) — if ten of your reports get fixed in one
  # day you earned all ten.
  #
  # Why this is needed: with the softer 50% floor above, 27 filed-but-unfixed
  # issues would total 15 points and outrank a merged PR (10-14), inverting the
  # invariant the test suite protects. Capping filing at 10 pulls that back
  # under a merged PR while leaving burst triage clearly worth doing. All the
  # real upside stays on the verified side.
  #
  # 10 is chosen so the cap bounds VOLUME without clipping QUALITY: a single
  # `bug`-labeled report (6) sits comfortably under it, and a `confirmed` one
  # (10) exactly reaches it. Lower values start punishing one good report.
  max_points_per_day: 10

  # VERIFIED DORMANT — and intentionally left that way. Two separate problems,
  # both measured on 2026-08-16 against Mantis + MantisAPI + Mantis-verticals:
  #
  #  1. WRONG NAMES. No repo has a `difficulty: N` label. The real ones are
  #     `diff:1` … `diff:10` (three repos). So these keys match nothing today.
  #
  #  2. SELF-GRADED — the reason not to simply rename them. Of 55 `diff:N`
  #     labelling events on human-authored issues, 44 were the issue's own
  #     author labelling their own ticket, and 42 of 62 landed within one
  #     minute of the issue being filed. People pick their own difficulty as
  #     they type. Paying points for that is paying people to grade their own
  #     homework, and it is the most gameable rule we could ship.
  #     Coverage is only 18% of human-authored issues, too.
  #
  # `imp:N` / `pri:N` are the better signal — 60% coverage, and ~74% applied by
  # the MantisCartography triage agent rather than the filer. The safe way to
  # turn any of this on is to score a label ONLY when the actor who applied it
  # is not the issue author (GraphQL `LabeledEvent.actor` exposes this), and
  # only once PR->issue linkage is healthy: just 27% of merged PRs currently
  # carry a `closes #N`, so a label-driven scheme would reach ~16% of work.
  #
  # HEADS UP if you ever enable these: `max_points_per_day` (10) clips FILING
  # points, so everything from tier 4 up would silently collapse to 10 and the
  # top of the scale would do nothing. Raise the ceiling, or move difficulty
  # onto the verified-fix side, before switching these on.
  # Emptied along with every other issue tier. These also OVERRIDE
  # `created_points`, so leaving values here would have kept issue scoring
  # alive for any labelled ticket. Former values, for whenever this comes
  # back: 1:3, 2:6, 3:10, 4:16, 5:24, 6:36 — and note the keys were wrong
  # anyway (the real labels are diff:1..diff:10).
  difficulty_points: {}

  duplicate_labels: ["duplicate", "wontfix", "invalid"]

# -----------------------------------------------------------------------------
# Manual / off-platform contributions
# -----------------------------------------------------------------------------
# Discord, talks, docs hosted elsewhere. Count ONLY when approved in
# data/manual.yml. Tune per-entry with `points` if needed.
manual_contributions:
  categories:
    discord_support: { points: 10, label: "Discord support",  emoji: "💬" }
    blog_post:       { points: 40, label: "Blog post",         emoji: "✍️" }
    demo:            { points: 30, label: "Demo / showcase",   emoji: "🎬" }
    documentation:   { points: 25, label: "Docs (off-repo)",   emoji: "📚" }
    mentorship:      { points: 35, label: "Mentorship",        emoji: "🧭" }
    event:           { points: 20, label: "Event / talk",      emoji: "🎤" }
    other:           { points: 10, label: "Other",             emoji: "⭐" }

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------
display:
  top_n_in_readme: 10
  # Humans only. Agents without a [bot] suffix still need an exact login.
  exclude_logins:
    - "dependabot[bot]"
    - "github-actions[bot]"
    - "renovate[bot]"
    - "MantisCartography"
    - "chatgpt-codex-connector"
    - "copilot-pull-request-reviewer"
    - "copilot-swe-agent"
  exclude_login_patterns:
    - "\\[bot\\]$"
    - "codex-connector"
    - "^copilot-"
  # Ranked by the first window. Rolling 7 × 24h = who's active now;
  # 14 = the same idea, slower. Midnight UTC is not a scoring boundary.
  windows_days: [7, 14]

  # The Bug finding board always uses this window, whichever window tab is
  # selected. A confirmed find depends on somebody ELSE closing your report,
  # and that lags filing by weeks — over 7 days the board mostly measures who
  # happened to get closes that week rather than who finds real bugs. Must be
  # one of `windows_days` so the tab can highlight correctly.
  bug_board_window_days: 14
