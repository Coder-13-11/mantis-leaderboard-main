# =============================================================================
# Mantis Leaderboard — Scoring Rules
# -----------------------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for how points are awarded.
# Change point values here and the leaderboard recomputes on the next run.
# No code changes needed. Every edit should go through a reviewed PR.
# =============================================================================

version: 1

# How far back to look. The leaderboard is recomputed from scratch each run,
# so this just bounds the API queries.
lookback_days: 365

# Exactly which repos this leaderboard tracks (owner/name). Add a line when
# a new Mantis repo exists; nothing else needs to change. This is also what
# the read-only token should be scoped to in GitHub settings — see README.md.
repos:
  - KellisLab/Mantis
  - KellisLab/MantisAPI
  - KellisLab/MantisIntegrations
  - KellisLab/Mantis-Public
  - KellisLab/Mantis_SDK
  - KellisLab/MantisExtensions
  - KellisLab/MantisExtensionsBackend
  - KellisLab/auto-meeting-minutes
  - KellisLab/Mantis-Discord-Bot
  - KellisLab/mantis_transcribe_minutes
  - KellisLab/mantis-docs
  - KellisLab/mantis_course
  - KellisLab/Mantis-verticals
  - KellisLab/generator-mantis
  - KellisLab/mantis-cli

# -----------------------------------------------------------------------------
# Pull Requests
# -----------------------------------------------------------------------------
pull_requests:
  # Points by PR size. Size is derived from (additions + deletions) AFTER
  # excluding generated/vendored files (see `exclude_paths`).
  #
  # Deliberately flat: XS to XL is only a 6.4x spread (it used to be 24x).
  # Line count alone should never be able to carry the leaderboard -- someone
  # merging one 1000-line PR shouldn't beat a week of careful smaller work.
  size_points:
    XS: 5
    S: 10
    M: 16
    L: 24
    XL: 32

  # Upper bound of net changed lines for each bucket. XL = anything larger.
  size_buckets:
    XS: 10
    S: 50
    M: 250
    L: 800
    # XL: everything above L

  # Multipliers stack (multiply together). Applied to the PR's base points.
  multipliers:
    documentation: 1.25   # PR has a label in `documentation_labels` below
    first_pr: 1.5         # contributor's first merged PR in the lookback window
    high_impact: 1.5      # PR has a label in `impact_labels` below

  documentation_labels: ["documentation", "docs"]

  # The counterweight to size-based scoring: a maintainer-applied label
  # saying this PR mattered beyond its diff size (e.g. a hard bug fix that's
  # only a 5-line change). Rename these to match whatever labels your repos
  # actually use.
  impact_labels: ["priority: critical", "priority: high", "impact: high"]

  # Files matching these globs don't count toward PR size (anti-gaming:
  # stops people inflating a PR to XL with lockfiles / generated code).
  exclude_paths:
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/*.lock"
    - "dist/**"
    - "build/**"
    - "**/vendor/**"
    - "**/*.min.js"
    - "**/*.map"

  # Only count PRs merged into these base branches.
  count_merges_to: ["main", "master"]

# -----------------------------------------------------------------------------
# Reviews  (anti-spam: only substantive reviews score)
# -----------------------------------------------------------------------------
reviews:
  approved_points: 20
  changes_requested_points: 15

  # A review must have a body at least this long to count. Kills "LGTM" farming.
  min_body_length: 15

  # Never score a review the PR author left on their own PR.
  exclude_self_review: true

  # Only the FIRST scored review per (reviewer, PR) counts. Re-approving the
  # same PR repeatedly does not stack.
  one_per_pr_per_reviewer: true

# -----------------------------------------------------------------------------
# Issues  (anti-farming: opening an issue scores ZERO by itself)
# -----------------------------------------------------------------------------
issues:
  # An issue only scores if a maintainer applies one of these trusted labels.
  # This is the "label gate": moderation collapses to clicking a label.
  confirmed_labels: ["confirmed", "bug-verified", "accepted"]
  confirmed_points: 10

  # Severity, from a maintainer-applied label, scales the base points above.
  # No severity label = 1x (the base). Rename these to match your labels.
  severity_multipliers:
    critical: 3
    high: 2
  severity_labels:
    critical: ["priority: critical", "severity: critical"]
    high: ["priority: high", "severity: major"]

  # When a confirmed issue is later closed (presumed fixed), the reporter
  # earns the same points again. Finding a real bug AND getting it fixed is
  # worth double just filing it -- this is how bug hunting competes with
  # writing code instead of being an afterthought.
  fixed_bonus_multiplier: 1

  # Issues closed as duplicate score nothing (native reason or these labels).
  duplicate_labels: ["duplicate", "wontfix", "invalid"]

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------
display:
  top_n_in_readme: 10
  exclude_logins: ["dependabot[bot]", "github-actions[bot]", "renovate[bot]"]
  # Trailing windows, in days, shown on the leaderboard -- not lifetime
  # total, so it's about who's active NOW. The first entry is the primary
  # one used for ranking (the "weekly spotlight"); the rest are shown
  # alongside it. Add a number here to show another window, no code changes.
  windows_days: [7, 14]
