name: Update Leaderboard

# Incremental listing every 30 minutes, plus a daily full audit, plus
# repository_dispatch from the GitHub webhook proxy. Recomputes scores from
# the event log and commits outputs to THIS repo only.
on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour (UTC). The 07:07 run is a full audit.
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        type: choice
        options: [incremental, full]
        default: incremental
  repository_dispatch:
    types: [github-activity]

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm test

      - name: Decide sync mode
        run: |
          EVENT="${{ github.event_name }}"
          INPUT="${{ github.event.inputs.mode }}"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT" ]; then
            MODE="$INPUT"
          elif [ "$EVENT" = "schedule" ] && [ "$HOUR" = "07" ] && [ "$MIN" -lt "20" ]; then
            MODE=full
          elif [ "$EVENT" = "repository_dispatch" ]; then
            MODE=incremental
          else
            MODE=incremental
          fi
          echo "SYNC_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Using SYNC_MODE=$MODE"

      - name: Build leaderboard
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          SYNC_MODE: ${{ env.SYNC_MODE }}
        run: npm run build

      - name: Commit refreshed outputs
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@github.com"
          git add data/leaderboard.json data/store site/index.html README.md
          git diff --cached --quiet || git commit -m "chore: refresh leaderboard [skip ci]"
          git push
