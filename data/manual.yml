# =============================================================================
# Manual / off-GitHub contributions
# -----------------------------------------------------------------------------
# Points for work the GitHub API can't see: Discord support, blog posts, demos,
# mentorship, docs hosted elsewhere. These are the ONLY points a human enters
# by hand — everything else is measured automatically.
#
# APPROVAL GATE: an entry counts toward the leaderboard ONLY when
# `approved: true`. To approve, set the flag and commit this file (ideally via
# a reviewed PR). The next scheduled run picks it up.
#
# Easiest way to add/approve entries: open `site/admin.html`, fill the form,
# and export — it produces this file for you. You can also edit by hand.
#
# Fields:
#   login        GitHub username the points go to            (required)
#   type         a key from `manual_contributions.categories` in rules.yml
#   points       optional; overrides the category default
#   description  short note shown in "Community Highlights"
#   date         YYYY-MM-DD the work happened (drives the trailing windows)
#   approved     true = counts, false/absent = pending, scores nothing
#   approved_by  who approved it (for the audit trail)
#   source       optional link (Discord thread, blog URL, ...)
#
# Example (delete or set approved: true to use it):
#   - login: octocat
#     type: blog_post
#     description: "Wrote 'Getting started with Mantis' on dev.to"
#     date: 2026-07-20
#     source: https://dev.to/octocat/getting-started-with-mantis
#     approved: false
#     approved_by: yeruvaai
# =============================================================================

contributions: []
