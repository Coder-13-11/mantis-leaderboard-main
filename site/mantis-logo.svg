<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" role="img" aria-label="Mantis">
  <!-- Sailboat mark in circle -->
  <g fill="currentColor">
    <circle cx="36" cy="36" r="32"/>
    <!-- reverse cutouts simulated with hole group via mask -->
  </g>
  <defs>
    <mask id="boatMask">
      <rect width="280" height="72" fill="black"/>
      <circle cx="36" cy="36" r="32" fill="white"/>
      <!-- star -->
      <path fill="black" transform="translate(46,14) scale(0.9)" d="M8 0 L9.5 5.5 L15 5.5 L10.5 9 L12.2 14.5 L8 11.2 L3.8 14.5 L5.5 9 L1 5.5 L6.5 5.5 Z"/>
      <!-- sails -->
      <path fill="black" d="M28 18 L28 44 L48 44 Z"/>
      <path fill="black" d="M26 22 L26 44 L12 44 Z"/>
      <!-- hull -->
      <path fill="black" d="M10 46 h52 l-6 8 H16 Z"/>
      <!-- waves -->
      <path fill="black" d="M12 58 Q20 52 28 58 Q36 64 44 58 Q52 52 60 58 L60 62 Q52 56 44 62 Q36 68 28 62 Q20 56 12 62 Z"/>
    </mask>
  </defs>
  <circle cx="36" cy="36" r="32" fill="currentColor" mask="url(#boatMask)"/>
  <!-- Wordmark -->
  <text x="82" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-0.5" fill="currentColor">Mantis</text>
</svg>
